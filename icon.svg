<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <mask id="cres">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="300" cy="215" r="150" fill="#000"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14263a"/>
      <stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <circle cx="122" cy="118" r="5" fill="#e6e9ee" opacity=".7"/>
  <circle cx="410" cy="392" r="4" fill="#e6e9ee" opacity=".5"/>
  <circle cx="96" cy="300" r="3.5" fill="#e6e9ee" opacity=".5"/>
  <!-- crescent -->
  <circle cx="232" cy="276" r="172" fill="#2dd4bf" mask="url(#cres)"/>
  <!-- contrail -->
  <path d="M150 432 Q 250 380 318 248" fill="none" stroke="#e6e9ee" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 20" opacity=".55"/>
  <!-- aircraft, climbing to the upper right over the moon -->
  <g transform="translate(352 190) rotate(40) scale(2.6)">
    <path d="M0,-48 C4,-48 6,-42 6,-34 L6,-10 L46,12 L46,20 L6,8 L5,30 L18,40 L18,46 L0,41 L-18,46 L-18,40 L-5,30 L-6,8 L-46,20 L-46,12 L-6,-10 L-6,-34 C-6,-42 -4,-48 0,-48 Z"
      fill="#f8fafc" stroke="#0b1016" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</svg>
